services:
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
    environment:
      ATTENDANCE_TIMEOUT_ENABLED: 'false'
    networks: [platform]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/api/v1/notifications/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
