name: Python worker tests
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s python
